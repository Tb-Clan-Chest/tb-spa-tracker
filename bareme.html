<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Barème — [SPA] LES Spartacus SPA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#15110C;color:#F1E7D0;font-family:'EB Garamond',Georgia,serif;font-size:16px}
a{color:#E3C274}a:hover{color:#FFF1C9}
.page{background-image:radial-gradient(ellipse at 20% 0%,rgba(217,180,90,.12),transparent 55%);padding:28px 24px 40px}
.cadre{max-width:1232px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.cz{font-family:Cinzel,serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:20px;border-bottom:1px solid #5A4529;padding-bottom:20px}
.blason{width:92px;height:88px;object-fit:cover;border-radius:20px;border:2px solid #D9B45A;box-shadow:0 6px 22px rgba(217,180,90,.30)}
.titre{display:flex;flex-direction:column;gap:4px;flex:1 1 240px;min-width:0}
.surtitre{font-family:Cinzel,serif;font-size:13px;letter-spacing:.24em;color:#BDAE8F}
h1{margin:0;font-family:Cinzel,serif;font-size:38px;font-weight:800;letter-spacing:.06em;color:#E3C274}
.sous{font-size:17px;color:#BDAE8F;font-style:italic}
.cycle{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;font-family:Cinzel,serif;font-size:15px}
.cycle .lib{flex:0 1 auto;min-width:0}
.cycle a,.cycle span.fl{flex:none}
.cycle a,.cycle span.fl{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #5A4529;border-radius:6px;text-decoration:none;color:#E3C274;background:#201912}
.cycle span.fl{opacity:.35}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bt{font-family:Cinzel,serif;font-weight:700;font-size:14px;text-decoration:none;color:#F1E7D0;border:1px solid #5A4529;border-radius:6px;padding:0 16px;line-height:44px;display:inline-flex;align-items:center;gap:8px;background:transparent}
.bt.actif{color:#1A140C;background:#D9B45A;border-color:#D9B45A}
.bt.off{opacity:.55;cursor:not-allowed}
.bt.calc{border-color:#D9B45A;background:linear-gradient(#3A2C17,#2A2010)}.bt.calc:hover{color:#FFF1C9}
.bt small{font-family:'EB Garamond',serif;font-weight:400;font-style:italic;font-size:13px}
.bandeau{background:#3A2412;border:1px solid #E6A94C;border-radius:8px;padding:12px 16px;font-size:17px}
.corps{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
main{flex:999 1 640px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:22px}
aside{flex:1 1 340px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:18px}
.boite{background:#201912;border:1px solid #5A4529;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.boite h2{margin:0;font-family:Cinzel,serif;font-size:18px;color:#E3C274}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.pod{background:#201912;border:1px solid #5A4529;border-radius:8px;padding:18px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nom{font-family:Cinzel,serif;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.pod .pts{font-family:Cinzel,serif;font-size:26px;font-weight:800;color:#E3C274}
.pod .det{font-size:15px;color:#BDAE8F}
.medaille{border-radius:50%;color:#1A140C;font-family:Cinzel,serif;font-weight:800;display:flex;align-items:center;justify-content:center}
.p1{background:linear-gradient(#2A2016,#201912);border-color:#D9B45A;border-top:3px solid #E8C15A;padding:26px 10px 28px;box-shadow:0 8px 26px rgba(217,180,90,.18)}
.p2{border-top:3px solid #C9CED6}.p3{border-top:3px solid #C88449;padding:14px 10px 16px}
.outils{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cherche{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:#15110C;border:1px solid #5A4529;border-radius:6px;width:220px}
.cherche input{border:0;outline:none;font:16px 'EB Garamond',serif;color:#F1E7D0;width:100%;background:transparent}
.filtre{height:44px;padding:0 12px;border:1px solid #5A4529;border-radius:6px;background:transparent;color:#BDAE8F;font:600 13px Cinzel,serif;cursor:pointer}
.filtre.actif{border-color:#D9B45A;background:#2A2016;color:#F1E7D0}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.reg{width:100%;border-collapse:collapse;min-width:720px}
.reg th{font-family:Cinzel,serif;font-size:11px;letter-spacing:.04em;color:#BDAE8F;text-align:left;padding:8px 6px;font-weight:600}
.reg td{padding:10px 5px;border-top:1px solid #3A2C1B;vertical-align:middle}
.reg .r{text-align:right}.reg .c{text-align:center}
.rang{font-family:Cinzel,serif;font-weight:700;color:#BDAE8F;font-size:14px}
.qui{display:flex;align-items:center;gap:10px}
.ecu{width:28px;height:32px;color:#1A140C;font-family:Cinzel,serif;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);padding-bottom:5px;flex:none;background:#D9B45A}
.ecu.vide{background:#5A4529}
.ecu.ex{background:#8C8068}
.nomj{font-family:Cinzel,serif;font-weight:700;font-size:16px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.exl{font-size:14px;color:#BDAE8F;font-style:italic}
.reg .exl{display:none}
.barre{position:relative;height:8px;background:#0F0C08;border:1px solid #3A2C1B;border-radius:999px;min-width:60px}
.barre i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.barre b{position:absolute;top:-5px;bottom:-5px;width:2px;background:#E3C274}
.barre b.ry{top:-3px;bottom:-3px;background:#F1E7D0;opacity:.55}
.badge{display:inline-block;font:700 11px Cinzel,serif;letter-spacing:.02em;padding:3px 8px;border-radius:999px;white-space:nowrap;color:#1A140C}
.ct{display:none}
.pj{display:block;font-size:13px;color:#BDAE8F;margin-top:2px;max-width:120px;line-height:1.15}
.ptsv{font-family:Cinzel,serif;font-weight:700;font-size:16px}
.gris{color:#BDAE8F}.vert{color:#9BD283}.rouge{color:#E0705F}.orange{color:#E6A94C}
.etat4{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid #5A4529}
.legende{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:16px}
.legende span{display:flex;align-items:center;gap:8px}.legende b{margin-left:auto;font-family:Cinzel,serif}
.pastille{width:10px;height:10px;border-radius:50%;flex:none}
.chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid #3A2C1B;padding-top:12px}
.chiffres div{display:flex;flex-direction:column}
.stat-label{font-size:14px;color:#BDAE8F;order:-1}
.stat-value{font-family:Cinzel,serif;font-size:22px;font-weight:700}
.ligne{display:flex;align-items:center;gap:10px;font-size:16px}
.ligne .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retard{box-shadow:inset 3px 0 0 #E0705F}
.tab2{width:100%;border-collapse:collapse;font-size:16px}
.tab2 th{font-family:Cinzel,serif;font-size:12px;letter-spacing:.1em;color:#BDAE8F;text-align:left;padding:6px 4px;font-weight:600}
.tab2 td{padding:6px 4px;border-top:1px solid #3A2C1B}
.jours{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}
.jours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:#BDAE8F;height:100%;justify-content:flex-end}
.jours i{width:100%;max-width:48px;background:#D9B45A;border-radius:4px 4px 0 0;min-height:2px}
.anneau{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.anneau span{width:104px;height:104px;border-radius:50%;background:#201912;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,serif}
.resume{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
footer{color:#7A6A4E;font-size:14px;text-align:center;border-top:1px solid #3A2C1B;padding-top:14px}
@media (max-width:600px){
 .page{padding:16px 12px 28px}
 h1{font-size:26px}.blason{width:64px;height:61px;border-radius:14px}
 .pod{padding:12px 4px 14px}.pod .nom{font-size:14px}.pod .pts{font-size:19px}.pod .det{font-size:13px}
 .cherche{width:100%}.outils{flex-direction:column;align-items:stretch}
 .resume{grid-template-columns:minmax(0,1fr)}
 .corps{flex-direction:column;align-items:stretch}
 main,aside{display:contents}
 .podium{order:0}.etatclan{order:1}.registre{order:2}aside>section:not(.etatclan){order:3}
 table.reg{min-width:0}.reg thead{display:none}.defile{overflow-x:visible}
 .reg tbody tr{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:6px;padding:10px 0;border-top:1px solid #3A2C1B}
 .reg td{border:0;padding:0}
 .reg .k-rang{order:1;flex:0 0 30px}.reg .k-nom{order:2;flex:1 1 0;min-width:0;overflow:hidden}.reg .k-pts{order:3;flex:none}.reg .k-etat{order:4;flex:none;text-align:right}
 .reg .pj{font-size:12px}.lg{display:none}.ct{display:inline}
 .reg .k-nom .qui{min-width:0}.reg .nomj{max-width:none;overflow:hidden;text-overflow:ellipsis;font-size:15px}.ecu{width:24px;height:28px}
 .reg .k-barre{order:5;flex:1 0 100%}.barre{min-width:0}
 .reg .k-anc,.reg .k-sa,.reg .k-res,.reg .k-cof{order:6;flex:1 1 0;min-width:0;text-align:left;font-size:15px}
 .reg .k-anc::before,.reg .k-sa::before,.reg .k-res::before,.reg .k-cof::before{content:attr(data-l);display:block;font:600 10px Cinzel,serif;letter-spacing:.08em;color:#BDAE8F}
}

.lj{color:inherit;text-decoration:none}.lj:hover{color:#FFF1C9;text-decoration:underline}
[hidden]{display:none!important}
.vue{display:flex;flex-direction:column;gap:22px}
.f-tete{background:#201912;border:1px solid #D9B45A;border-radius:10px;box-shadow:inset 0 0 0 5px #201912,inset 0 0 0 6px rgba(217,180,90,.28);padding:24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.f-ecu{width:72px;height:82px;background:#D9B45A;color:#1A140C;font:800 24px Cinzel,serif;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);padding-bottom:12px;flex:none}
.f-ecu.vide{background:#5A4529;color:#F1E7D0}.f-ecu.ex{background:#8C8068}
.f-id{display:flex;flex-direction:column;gap:6px;flex:1 1 240px;min-width:0}
.f-id h2{margin:0;font:800 36px Cinzel,serif;letter-spacing:.04em;color:#E3C274;overflow-wrap:anywhere}
.f-sous{font-size:17px;color:#BDAE8F;font-style:italic;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f-sous img{width:28px;height:27px;object-fit:cover;border-radius:7px;border:1px solid #D9B45A}
.f-rang{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 8px;text-align:center}
.f-rang .t{font:600 13px Cinzel,serif;letter-spacing:.12em;color:#BDAE8F}
.f-rang .v{font:800 40px Cinzel,serif;line-height:1}
.f-rang .s{font-size:15px;color:#BDAE8F}
.f-moi{height:48px;padding:0 16px;border:1px solid #5A4529;border-radius:6px;background:#2A2016;color:#F1E7D0;font:700 14px Cinzel,serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.f-moi.oui{border-color:#D9B45A;background:#3A2C17}
.f-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.f-annule{background:transparent;border:0;color:#BDAE8F;font:15px 'EB Garamond',serif;text-decoration:underline;cursor:pointer;padding:4px}
.f-compte{font-size:16px;color:#BDAE8F;flex-basis:100%}
.f-bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f-carte{background:#201912;border:1px solid #5A4529;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.f-carte .t{font:600 13px Cinzel,serif;letter-spacing:.1em;color:#BDAE8F}
.f-carte .v{font:700 28px Cinzel,serif}
.f-carte .v small{font-size:16px;color:#BDAE8F}
.f-carte .p{font-size:15px;color:#BDAE8F}
.f-large{grid-column:1/-1}
.f-barre{position:relative;height:10px;background:#0F0C08;border:1px solid #5A4529;border-radius:999px;margin:6px 0}
.f-barre i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.f-barre b{position:absolute;top:-6px;bottom:-6px;width:2px;background:#E3C274}
.f-barre b.ry{top:-4px;bottom:-4px;background:#F1E7D0;opacity:.6}
.f-barre u{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#8FA9C6;border:2px solid #15110C}
.f-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#BDAE8F}
.f-leg span{display:inline-flex;align-items:center;gap:6px}
.f-res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:15px}
.f-res .n{min-width:0}
.f-res .q{text-align:right;font-family:Cinzel,serif;font-weight:700;white-space:nowrap}
.f-res .f-barre{grid-column:1/-1;margin:2px 0 8px}
.f-deux{display:flex;flex-wrap:wrap;gap:16px}
.f-graph{flex:999 1 520px;min-width:0}
.f-cats{flex:1 1 320px;min-width:0}
.f-axe{position:relative;height:260px;border-left:1px solid #5A4529;border-bottom:1px solid #5A4529;margin-left:44px}
.f-axe .y{position:absolute;left:-46px;width:40px;text-align:right;font-size:13px;color:#BDAE8F;transform:translateY(50%)}
.f-axe .gl{position:absolute;left:0;right:0;border-top:1px solid #2E241A}
.f-cols{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.f-col{position:relative;height:100%}
.f-col .bar{position:absolute;bottom:0;left:22%;right:22%;background:linear-gradient(#B8913E,#7A5F27);border:1px solid #D9B45A;border-bottom:0;border-radius:4px 4px 0 0}
.f-col.sel .bar{background:linear-gradient(#E3C274,#9C7A30);border-color:#F1D58A}
.f-col .val{position:absolute;left:0;right:0;text-align:center;font:700 15px Cinzel,serif;transform:translateY(-4px)}
.f-col .obj{position:absolute;left:6%;right:6%;border-top:2px dashed #F1E7D0}
.f-col .med{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#8FA9C6;border:2px solid #15110C;transform:translateY(50%)}
.f-col .nd{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#7A6A4E;font-style:italic}
.f-xl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin-left:44px;text-align:center;font-size:14px;color:#BDAE8F;gap:4px}
.f-xl .sel{color:#F1E7D0;font-weight:600}
.f-xl i{display:block;font-size:13px}
.f-cat{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:16px}
.f-cat span{color:#BDAE8F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-cat div{height:10px;background:#0F0C08;border:1px solid #3A2C1B;border-radius:999px;overflow:hidden}
.f-cat div i{display:block;height:100%;background:#D9B45A}
.f-cat b{font:700 15px Cinzel,serif;text-align:right}
.f-copie{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.f-copie textarea{width:100%;min-height:130px;background:#15110C;color:#F1E7D0;border:1px solid #5A4529;border-radius:6px;font:15px 'EB Garamond',serif;padding:8px}
.f-retour{font:700 15px Cinzel,serif;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.l-rang{font-family:Cinzel,serif;font-weight:700;color:#BDAE8F;font-size:14px;width:44px;flex:none}
.l-ligne{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #3A2C1B;min-width:0}
.l-ligne .nomj{flex:1 1 auto;max-width:none;min-width:0}
.l-ligne .ptsv{flex:none;width:70px;text-align:right}
.l-ligne .badge{flex:none}
@media (max-width:600px){
 .f-tete{padding:16px;gap:14px}.f-id h2{font-size:26px}.f-ecu{width:56px;height:64px;font-size:19px;padding-bottom:9px}
 .f-rang .v{font-size:30px}.f-actions{flex:1 1 100%}.f-moi{justify-content:center}
 .f-bilan{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.f-carte{padding:12px}.f-carte .v{font-size:23px}.f-carte .p{font-size:14px}
 .f-axe{height:200px;margin-left:38px}.f-axe .y{left:-40px;width:34px;font-size:12px}.f-xl{margin-left:38px;font-size:13px}
 .f-col .bar{left:14%;right:14%}.f-col .val{font-size:13px}
 .f-cat{grid-template-columns:minmax(0,120px) minmax(0,1fr) 36px;font-size:15px}
 .l-rang{width:34px}.l-ligne .ptsv{width:54px}.l-ligne .badge .lg{display:none}.l-ligne .badge .ct{display:inline}
}

.fond{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5}
.fond-clan{background:url(fond_higgs_clan_gauche.webp) 15% 20%/cover no-repeat}
.fond-joueur{background:url(fond_higgs_joueur.webp) 80% 40%/cover no-repeat}
.fond-clan:not([hidden])~.page .surtitre,.fond-clan:not([hidden])~.page header h1{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7)}
@media (max-width:640px){
 .fond{opacity:.35}
 .fond-clan{background-position:12% 15%}
 .fond-joueur{background-position:85% 35%}
 header{align-items:flex-start}
}

.sign{--line:#5A4529;--dim:#8C8068;--f-display:"Cinzel", "Trajan Pro", Georgia, serif;--gold-hi:#E3C274}
.sign{border-top:1px solid var(--line);padding-top:14px;text-align:center;color:var(--dim);font-size:.92rem;font-style:italic}
.sign a{font-family:var(--f-display);font-style:normal;font-weight:700;letter-spacing:.14em;color:var(--gold-hi);text-decoration:none}
.sign a:hover{color:#FFF1C9}
.rep{font-size:.72em;font-weight:400;opacity:.7;margin-left:.25em;letter-spacing:0;text-transform:none}
.f-det{border-top:1px solid #3A2C1B}.f-det summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;padding:9px 2px;list-style:none}
.f-det summary::-webkit-details-marker{display:none}.f-det summary span::before{content:"▸ ";color:#BDAE8F}.f-det[open] summary span::before{content:"▾ "}
.f-det summary b{white-space:nowrap;color:#E3C274;font-weight:600}.f-dtb{overflow-x:auto;margin:0 0 10px}
.f-dt,.bt-tab{width:100%;border-collapse:collapse;font-size:15px}.f-dt th,.f-dt td,.bt-tab th,.bt-tab td{padding:5px 8px;border-bottom:1px solid #2E2416;text-align:left}
.f-dt th,.bt-tab th{color:#BDAE8F;font-weight:600;font-size:13px;letter-spacing:.04em}.f-dt .r,.bt-tab .r{text-align:right;white-space:nowrap}.f-dt .c,.bt-tab .c{text-align:center}
.f-dt tr.z td,.bt-tab tr.z td{color:#7D715C}.bt-defile{overflow-x:auto;max-width:100%}.bt-tab{min-width:520px}.bt-tab small{color:#BDAE8F;font-size:.8em}
.bt-outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}.bt-outils select,.bt-outils input{background:#15100A;color:#F1E7D0;border:1px solid #5A4529;border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;max-width:100%}
